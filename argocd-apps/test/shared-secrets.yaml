apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-secrets-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/simple-distributed-system/notes-gitops-config
    targetRevision: master
    path: environments/test/shared/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
