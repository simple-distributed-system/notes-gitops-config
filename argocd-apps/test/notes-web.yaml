apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes-web-test
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/simple-distributed-system/helm-charts
      path: helm-notes-web
      targetRevision: main
      helm:
        valueFiles:
          - $values/environments/test/notes-web/values.yaml
    - repoURL: https://github.com/simple-distributed-system/notes-gitops-config
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: notes-test
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
